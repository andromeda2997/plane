# Baut das angepasste Plane-Backend (apps/api: api, worker, beat-worker, migrator)
# und legt es in der GitHub Container Registry ab.
# Zweig custom/vX.Y.Z  ->  ghcr.io/<owner>/plane-backend:vX.Y.Z-custom.<lauf>, :vX.Y.Z-custom, :sha-<kurz>
# Der Server zieht den beweglichen Tag vX.Y.Z-custom per Timer (siehe deployments/custom/README.md).
name: Custom Backend Image

on:
  push:
    branches:
      - "custom/**"
    paths:
      - "apps/api/**"
      - ".github/workflows/custom-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Backend-Image bauen und pushen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Version aus dem Zweignamen ableiten
        id: ver
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            custom/v*) version="${ref#custom/}" ;;
            *) echo "Zweig '$ref' ist kein custom/vX.Y.Z-Zweig" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plane-backend" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}-custom.${{ github.run_number }}
            type=raw,value=${{ steps.ver.outputs.version }}-custom
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=plane-backend (custom)
            org.opencontainers.image.description=Angepasstes Plane-Backend auf Basis von makeplane/plane ${{ steps.ver.outputs.version }}

      # Kontext und Dockerfile wie upstream (.github/workflows/build-branch.yml).
      # Dockerfile.api hat nur das optionale ARG APK_SECURITY_PATCH (mit Standardwert),
      # daher keine build-args. Eigener Cache-Scope, damit sich Frontend- und
      # Backend-Build den GHA-Cache nicht gegenseitig ueberschreiben.
      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.api
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=custom-backend
          cache-to: type=gha,mode=max,scope=custom-backend
