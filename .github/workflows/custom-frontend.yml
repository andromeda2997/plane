# Baut das angepasste Plane-Frontend (apps/web) und legt es in der GitHub Container Registry ab.
# Zweig custom/vX.Y.Z  ->  ghcr.io/<owner>/plane-frontend:vX.Y.Z-custom.<lauf>, :vX.Y.Z-custom, :sha-<kurz>
# Der Server zieht den beweglichen Tag vX.Y.Z-custom per Timer (siehe ANLEITUNG des Betreibers).
name: Custom Frontend Image

on:
  push:
    branches:
      - "custom/**"
    paths:
      - "apps/web/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".github/workflows/custom-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Frontend-Image bauen und pushen
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Version aus dem Zweignamen ableiten
        id: ver
        run: |
          ref="${GITHUB_REF_NAME}"
          case "$ref" in
            custom/v*) version="${ref#custom/}" ;;
            *) echo "Zweig '$ref' ist kein custom/vX.Y.Z-Zweig" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/plane-frontend" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}-custom.${{ github.run_number }}
            type=raw,value=${{ steps.ver.outputs.version }}-custom
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=plane-frontend (custom)
            org.opencontainers.image.description=Angepasstes Plane-Frontend auf Basis von makeplane/plane ${{ steps.ver.outputs.version }}

      - name: Bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile.web
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Leere VITE_*_URL wie in den offiziellen Images: relative URLs, Domain kommt vom Proxy.
          build-args: |
            VITE_API_BASE_URL=
            VITE_ADMIN_BASE_URL=
            VITE_LIVE_BASE_URL=
            VITE_SPACE_BASE_URL=
            VITE_WEB_BASE_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max
